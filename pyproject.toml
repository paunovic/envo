[project]
name = "envo"
version = "0.1.0"
description = "Run a command envoing another environment's identity"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
envo = "envo:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 90
